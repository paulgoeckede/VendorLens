<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../../assets/css/popup.css" />
  </head>
  <body>
    <h1>VendorLens - Seller Info for Amazon</h1>

    <div class="card">
      <div class="setting-row">
        <span class="label">Scanner active</span>
        <label class="switch">
          <input type="checkbox" id="masterSwitch" checked />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <div
        style="
          font-size: 12px;
          font-weight: bold;
          margin-bottom: 8px;
          color: #333;
        "
      >
        Actions
      </div>

      <div class="setting-row">
        <span class="label">Hide products from China</span>
        <label class="switch">
          <input type="checkbox" id="hideChina" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card support-card">
      <div class="stats-text">
        🕵️‍♂️ <strong id="scannedCount">0</strong> products scanned<br />
        <span style="font-size: 11px; color: #dc2626">
          🛡️ <strong id="chinaCount">0</strong> Chinese sellers detected/hidden
        </span>
      </div>
      <p class="support-subtext">
        Built by a CS student: 100% ad-free & no tracking.
      </p>
      <a
        href="https://ko-fi.com/VendorLens"
        target="_blank"
        rel="noopener noreferrer"
        class="kofi-btn"
      >
        ☕ Buy me a coffee ($3)
      </a>
    </div>

    <div style="margin-top: 10px; font-size: 11px; text-align: center">
      <a
        href="__STORE_URL__"
        target="_blank"
        style="color: #64748b; text-decoration: none; display: inline-block"
      >
        ⭐ Enjoying VendorLens? Leave a review!
      </a>
    </div>

    <div class="footer">Version __VERSION__</div>

    <script src="popup.js"></script>
  </body>
</html>
